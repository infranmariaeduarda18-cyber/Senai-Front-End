<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
<style>
        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Formulário de Pesquisa</h1>

    <form>

        <label for="pesquisa">Digite sua pesquisa:</label>

        <input type="text" id="pesquisa" required>

        <button type="submit">Pesquisar</button>

    </form>

</body>
</html>
